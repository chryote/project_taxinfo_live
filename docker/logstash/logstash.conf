input {
  tcp {
    port => 5044
    codec => json_lines
  }
  http {
    port => 8088
    codec => json
  }
}

filter {
  mutate {
    add_field => { "environment" => "poc-green" }
    add_field => { "application" => "pajak-kendaraan-bermotor" }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pajak-kendaraan-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => dots
  }
}
