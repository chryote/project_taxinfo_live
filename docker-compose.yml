services:
  # ----------------------------------------------------------------------
  # Database with pgvector extension (PostgreSQL 16 + Vector Embeddings)
  # ----------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: samsat-postgres-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pajak_kendaraan}
      POSTGRES_USER: ${POSTGRES_USER:-samsat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samsat_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgvector-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samsat_user} -d ${POSTGRES_DB:-pajak_kendaraan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------
  # RabbitMQ (Async Event Broker & Payment Task Ingestion)
  # ----------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: samsat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-samsat_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-samsat_mq_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------
  # Elasticsearch (Lightweight Single-Node Search & Telemetry Store)
  # ----------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: samsat-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------
  # Logstash (Lightweight Pipeline Event Ingestion for Audit Logs)
  # ----------------------------------------------------------------------
  logstash:
    image: logstash:8.13.4
    container_name: samsat-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xms128m -Xmx256m"
      PIPELINE_WORKERS: 1
      PIPELINE_BATCH_SIZE: 25
    volumes:
      - ./docker/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./docker/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "8088:8088"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------
  # Kibana (Telemetry & Tax Analytics Dashboard)
  # ----------------------------------------------------------------------
  kibana:
    image: kibana:8.13.4
    container_name: samsat-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------
  # Backend API (Node.js/TypeScript Fastify High-Performance Green Engine)
  # ----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samsat-backend-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pajak_kendaraan}
      POSTGRES_USER: ${POSTGRES_USER:-samsat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samsat_secure_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-samsat_mq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-samsat_mq_pass}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ENABLE_ECO_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------
  # Frontend UI (Vue.js 3 + Vite + Nginx Green Static Compression)
  # ----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samsat-frontend-vue
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ----------------------------------------------------------------------
  # K6 Load Tester (Automated Benchmark Runner)
  # ----------------------------------------------------------------------
  k6:
    image: grafana/k6:latest
    container_name: samsat-k6-runner
    profiles: ["bench"]
    volumes:
      - ./k6/scenarios:/scripts:ro
    environment:
      - BASE_URL=http://backend:3000
    depends_on:
      - backend

volumes:
  pgvector-data:
  es-data:
